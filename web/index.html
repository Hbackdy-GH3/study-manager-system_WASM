<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F2E9">
<title>Study Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading" class="loading"><span class="brand">study<span>/</span>manager</span><span class="muted">Opening your topics…</span></div>

<div class="app" id="app" hidden>
  <aside class="side">
    <p class="brand">study<span>/</span>manager</p>
    <nav class="nav" aria-label="Main">
      <button data-view="today" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
      <button data-view="topics">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2" stroke-linejoin="round"/></svg><span>Topics</span></button>
      <button data-view="plan">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Plan</span></button>
      <button data-view="progress">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"/></svg><span>Progress</span></button>
    </nav>
    <div class="backup">
      <p class="backup-title">Backup</p>
      <p class="backup-text">Every change saves on its own in this browser. Export a copy to keep it safe or move it to another device.</p>
      <div class="backup-btns">
        <button class="btn btn-quiet btn-sm" id="btn-export">Export</button>
        <button class="btn btn-quiet btn-sm" id="btn-import">Import</button>
      </div>
      <input type="file" id="import-file" accept=".json,.txt,.csv" hidden>
    </div>
  </aside>

  <main class="main">
    <section class="view" id="view-today" aria-label="Today"></section>
    <section class="view" id="view-topics" aria-label="Topics" hidden></section>
    <section class="view" id="view-plan" aria-label="Plan" hidden></section>
    <section class="view" id="view-progress" aria-label="Progress" hidden></section>
  </main>
</div>

<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button id="toast-undo" hidden>Undo</button></div>

<script src="app.js"></script>
<script src="files.js"></script>
<script src="study.js"></script>
</body>
</html>
